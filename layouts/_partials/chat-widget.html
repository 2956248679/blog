<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
.ai-chat-box{position:fixed;bottom:88px;right:24px;z-index:999;width:400px;height:560px;background:var(--color-base-100,#fff);border:1px solid var(--color-base-300,#e5e7eb);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);display:none;flex-direction:column;overflow:hidden}
.ai-chat-box.open{display:flex}
.ai-chat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--color-base-300,#e5e7eb);background:var(--color-base-200,#f9fafb)}
.ai-chat-header span{font-weight:700;font-size:15px}
.ai-chat-header button{background:none;border:none;font-size:20px;cursor:pointer;padding:0 4px}
.ai-chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.ai-chat-msgs .msg{padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.7;max-width:88%;word-break:break-word}
.ai-chat-msgs .user{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ai-chat-msgs .bot{background:var(--color-base-200,#f3f4f6);align-self:flex-start;border-bottom-left-radius:4px}
.ai-chat-msgs .bot p{margin:4px 0}
.ai-chat-msgs .bot pre{background:#1e1e2e;color:#cdd6f4;padding:14px;border-radius:10px;overflow-x:auto;font-size:13px;margin:8px 0}
.ai-chat-msgs .bot code{font-family:monospace;font-size:13px}
.ai-chat-msgs .bot :not(pre)>code{background:var(--color-base-300,#ddd);padding:2px 6px;border-radius:4px}
.ai-chat-msgs .bot table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
.ai-chat-msgs .bot td,.ai-chat-msgs .bot th{border:1px solid var(--color-base-300,#ddd);padding:6px 10px;text-align:left}
.ai-chat-msgs .bot th{background:var(--color-base-300,#eee);font-weight:600}
.ai-chat-msgs .bot ul,.ai-chat-msgs .bot ol{margin:4px 0;padding-left:20px}
.ai-chat-msgs .bot li{margin:3px 0}
.ai-chat-msgs .bot hr{border:none;border-top:1px solid var(--color-base-300,#ddd);margin:12px 0}
.ai-chat-msgs .bot strong{color:#6366f1}
.ai-chat-input{display:flex;padding:12px 14px;border-top:1px solid var(--color-base-300,#e5e7eb);gap:8px}
.ai-chat-input input{flex:1;border:1px solid var(--color-base-300,#e5e7eb);border-radius:10px;padding:10px 14px;font-size:14px;outline:none;background:var(--color-base-100,#fff);color:var(--color-base-content,#333)}
.ai-chat-input input:focus{border-color:#6366f1}
.ai-chat-input button{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
@media(max-width:480px){.ai-chat-box{width:calc(100vw - 32px);right:16px;height:60vh;bottom:16px}}
</style>

<div class="ai-chat-box" id="ai-chat-box">
  <div class="ai-chat-header"><span>✨ AI 助手</span><button onclick="toggleChat()">✕</button></div>
  <div class="ai-chat-msgs" id="ai-chat-msgs">
    <div class="msg bot">👋 你好！我是半亩方塘的 AI 助手。<br>有什么想问的吗？</div>
  </div>
  <div class="ai-chat-input">
    <input id="ai-input" placeholder="输入问题…" onkeydown="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()">发送</button>
  </div>
</div>

<script>
var DK="sk-b498436e74c24e0d97a6c7aca6030ac4";
marked.setOptions({breaks:true,gfm:true});

function toggleChat(){document.getElementById('ai-chat-box').classList.toggle('open')}

async function sendMsg(){
  var i=document.getElementById('ai-input'),m=i.value.trim();
  if(!m)return;
  addMsg(m,'user');i.value='';var el=addMsg('','bot');el.textContent='...';
  try{
    var r=await fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+DK},
      body:JSON.stringify({model:'deepseek-chat',stream:true,messages:[
        {role:'system',content:'你是半亩方塘博客的AI助手。请简洁回答，合理使用Markdown格式。'},
        {role:'user',content:m}
      ],max_tokens:2000})
    });
    var reader=r.body.getReader(),decoder=new TextDecoder(),text='';
    el.innerHTML='';
    while(true){
      var{done,value}=await reader.read();
      if(done)break;
      var chunk=decoder.decode(value,{stream:true});
      var lines=chunk.split('\n');
      for(var j=0;j<lines.length;j++){
        var line=lines[j];
        if(!line.startsWith('data: '))continue;
        var data=line.slice(6);
        if(data==='[DONE]')continue;
        try{var json=JSON.parse(data);text+=json.choices[0].delta.content||'';}catch(e){}
      }
      el.innerHTML=marked.parse(text);
      el.scrollIntoView({behavior:'smooth'});
    }
  }catch(e){el.innerHTML='出错了，请稍后重试'}
}

function addMsg(t,c){var d=document.createElement('div');d.className='msg '+c;d.textContent=t;document.getElementById('ai-chat-msgs').appendChild(d);d.scrollIntoView({behavior:'smooth'});return d}
</script>

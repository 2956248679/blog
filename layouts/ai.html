{{ define "main" }}
<div style="max-width: 100%;">

  <!-- 聊天消息区 -->
  <div id="ai-chat-msgs" class="overflow-y-auto space-y-3 px-1 pb-2" style="max-height: calc(100vh - 260px); min-height: 200px;">
    <div class="chat chat-start">
      <div class="chat-bubble bg-base-200 text-base-content">
        👋 你好！我是半亩方塘的 AI 助手，由 DeepSeek 驱动。<br>
        有什么想问的吗？
      </div>
    </div>
  </div>

  <!-- 输入区 -->
  <div class="border-t border-base-300 pt-3 pb-1">
    <div class="flex gap-2">
      <input
        id="ai-input"
        type="text"
        placeholder="输入你的问题…"
        class="input input-bordered flex-1 input-sm"
        onkeydown="if(event.key==='Enter')sendMsg()"
      />
      <button class="btn btn-primary btn-sm" onclick="sendMsg()">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        发送
      </button>
    </div>
    <p class="text-xs text-base-content/40 mt-1.5 text-center">AI 回答仅供参考 · 由 DeepSeek 提供支持</p>
  </div>

</div>

<script>
async function sendMsg() {
  const input = document.getElementById('ai-input');
  const msg = input.value.trim();
  if (!msg) return;
  addMsg(msg, 'end');
  input.value = '';
  input.disabled = true;

  const { wrapper, bubble } = addMsg('', 'start');
  bubble.textContent = '思考中…';
  bubble.classList.add('opacity-50');

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    if (!r.ok) throw new Error('API error');
    const d = await r.json();
    typeWriter(bubble, d.reply, 20);
  } catch (e) {
    bubble.textContent = '⚠️ 后端 API 尚未接入。接入 DeepSeek API 后即可正常对话。当前为前端演示效果。';
    bubble.classList.remove('opacity-50');
  }
  input.disabled = false;
  input.focus();
}

function addMsg(text, side) {
  const wrapper = document.createElement('div');
  wrapper.className = 'chat chat-' + side;

  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble ' + (side === 'end' ? 'bg-primary text-primary-content' : 'bg-base-200 text-base-content');

  if (text) bubble.textContent = text;

  wrapper.appendChild(bubble);
  document.getElementById('ai-chat-msgs').appendChild(wrapper);
  wrapper.scrollIntoView({ behavior: 'smooth' });
  return { wrapper, bubble };
}

function typeWriter(el, text, speed) {
  el.textContent = '';
  el.classList.remove('opacity-50');
  let i = 0;
  function type() {
    if (i < text.length) {
      el.textContent += text.charAt(i);
      i++;
      el.parentElement.scrollIntoView({ behavior: 'smooth' });
      setTimeout(type, speed);
    }
  }
  type();
}
</script>
{{ end }}
